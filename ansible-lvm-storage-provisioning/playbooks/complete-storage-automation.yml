---
- name: Complete Storage Management Automation
  hosts: storage_servers
  become: yes
  vars:
    target_disk: /dev/nvme1n1
    partition_device: /dev/nvme1n1p1
    volume_group_name: vg_data
    logical_volumes:
      - name: lv_web
        size: 2G
        mount_point: /var/www
        filesystem: ext4
        mount_options: defaults
        dump: 1
        passno: 2
      - name: lv_logs
        size: 1G
        mount_point: /var/log/apps
        filesystem: xfs
        mount_options: defaults,noatime
        dump: 1
        passno: 2
      - name: lv_backup
        size: 1G
        mount_point: /backup
        filesystem: ext4
        mount_options: defaults
        dump: 1
        passno: 2

  tasks:
    - name: Install required packages
      package:
        name:
          - lvm2
          - parted
          - xfsprogs
        state: present

    - name: Check target disk exists
      stat:
        path: "{{ target_disk }}"
      register: disk_check

    - name: Stop if target disk does not exist
      fail:
        msg: "Target disk {{ target_disk }} does not exist"
      when: not disk_check.stat.exists

    - name: Create LVM partition on target disk
      community.general.parted:
        device: "{{ target_disk }}"
        number: 1
        state: present
        part_type: primary
        part_start: 1MiB
        part_end: 100%
        flags: [lvm]

    - name: Create volume group
      lvg:
        vg: "{{ volume_group_name }}"
        pvs: "{{ partition_device }}"
        state: present

    - name: Create logical volumes
      lvol:
        vg: "{{ volume_group_name }}"
        lv: "{{ item.name }}"
        size: "{{ item.size }}"
        state: present
      loop: "{{ logical_volumes }}"

    - name: Create mount point directories
      file:
        path: "{{ item.mount_point }}"
        state: directory
        mode: '0755'
      loop: "{{ logical_volumes }}"

    - name: Format logical volumes
      filesystem:
        fstype: "{{ item.filesystem }}"
        dev: "/dev/{{ volume_group_name }}/{{ item.name }}"
        force: false
      loop: "{{ logical_volumes }}"

    - name: Backup fstab
      copy:
        src: /etc/fstab
        dest: /etc/fstab.backup.{{ ansible_date_time.epoch }}
        remote_src: yes

    - name: Mount logical volumes and persist in fstab
      ansible.posix.mount:
        path: "{{ item.mount_point }}"
        src: "/dev/{{ volume_group_name }}/{{ item.name }}"
        fstype: "{{ item.filesystem }}"
        opts: "{{ item.mount_options }}"
        dump: "{{ item.dump }}"
        passno: "{{ item.passno }}"
        state: mounted
      loop: "{{ logical_volumes }}"

    - name: Create validation files
      copy:
        content: |
          Storage automation test successful.
          Logical Volume: {{ item.name }}
          Mount Point: {{ item.mount_point }}
          Filesystem: {{ item.filesystem }}
          Created: {{ ansible_date_time.iso8601 }}
        dest: "{{ item.mount_point }}/storage_test.txt"
        mode: '0644'
      loop: "{{ logical_volumes }}"

    - name: Display final storage configuration
      shell: |
        echo "=== BLOCK DEVICES ==="
        lsblk
        echo
        echo "=== PHYSICAL VOLUMES ==="
        pvs
        echo
        echo "=== VOLUME GROUPS ==="
        vgs
        echo
        echo "=== LOGICAL VOLUMES ==="
        lvs
        echo
        echo "=== MOUNTED FILESYSTEMS ==="
        df -h | grep vg_data || true
        echo
        echo "=== FSTAB ENTRIES ==="
        grep vg_data /etc/fstab || true
      register: storage_summary
      changed_when: false

    - name: Show storage summary
      debug:
        msg: "{{ storage_summary.stdout_lines }}"
