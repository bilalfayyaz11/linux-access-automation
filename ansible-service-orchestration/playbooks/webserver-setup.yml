---
- name: Configure Apache Web Server
  hosts: webservers
  become: yes

  tasks:
    - name: Create custom homepage
      copy:
        dest: /var/www/html/index.html
        content: |
          <h1>Apache Web Server</h1>
          <p>Managed by Ansible</p>
          <p>Host: {{ inventory_hostname }}</p>

    - name: Start and enable Apache
      systemd:
        name: httpd
        state: started
        enabled: yes

    - name: Verify website
      uri:
        url: http://127.0.0.1
        status_code: 200
