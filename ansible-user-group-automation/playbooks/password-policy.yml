---
- name: Configure User Password Policies
  hosts: webservers
  become: yes

  vars:
    password_policies:
      - { username: alice, max_days: 90, min_days: 7, warn_days: 14 }
      - { username: bob, max_days: 60, min_days: 5, warn_days: 10 }
      - { username: charlie, max_days: 180, min_days: 14, warn_days: 21 }

  tasks:
    - name: Set password aging policies
      command: "chage -M {{ item.max_days }} -m {{ item.min_days }} -W {{ item.warn_days }} {{ item.username }}"
      loop: "{{ password_policies }}"
      changed_when: true
      tags: password_aging

    - name: Display password policy
      command: "chage -l {{ item.username }}"
      register: password_info
      loop: "{{ password_policies }}"
      changed_when: false
      tags: info

    - name: Show password policy details
      debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ password_info.results }}"
      tags: info
