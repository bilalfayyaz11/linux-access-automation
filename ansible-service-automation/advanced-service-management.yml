---
- name: Advanced Multi-Service Management
  hosts: webservers
  become: yes

  vars:
    services_to_manage:
      - name: httpd
        state: started
        enabled: yes
      - name: crond
        state: started
        enabled: yes
      - name: firewalld
        state: started
        enabled: yes

  tasks:
    - name: Display services to be managed
      debug:
        msg: "Managing service: {{ item.name }}"
      loop: "{{ services_to_manage }}"

    - name: Manage service states using systemd
      systemd:
        name: "{{ item.name }}"
        state: "{{ item.state }}"
        enabled: "{{ item.enabled }}"
        daemon_reload: yes
      loop: "{{ services_to_manage }}"
      register: service_results

    - name: Display service management results
      debug:
        msg: "Service {{ item.item.name }} changed={{ item.changed }}"
      loop: "{{ service_results.results }}"

    - name: Verify service status
      systemd:
        name: "{{ item.name }}"
      loop: "{{ services_to_manage }}"
      register: service_status

    - name: Report service status
      debug:
        msg: "{{ item.item.name }} is {{ item.status.ActiveState }} and {{ item.status.UnitFileState }}"
      loop: "{{ service_status.results }}"
