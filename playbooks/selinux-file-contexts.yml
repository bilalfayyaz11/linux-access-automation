---
- name: Manage SELinux File Contexts
  hosts: selinux_servers
  become: yes

  vars:
    webapp_directory: /opt/webapp
    custom_app_directory: /opt/myapp

  tasks:

    - name: Create test directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ webapp_directory }}"
        - "{{ custom_app_directory }}"
        - "{{ custom_app_directory }}/logs"
        - "{{ custom_app_directory }}/config"

    - name: Create test files
      copy:
        content: "<h1>SELinux Managed Application</h1>"
        dest: "{{ webapp_directory }}/index.html"
        mode: '0644'

    - name: Set file context for web application directory
      community.general.sefcontext:
        target: "{{ webapp_directory }}(/.*)?"
        setype: httpd_sys_content_t
        state: present

    - name: Set file context for custom app logs
      community.general.sefcontext:
        target: "{{ custom_app_directory }}/logs(/.*)?"
        setype: var_log_t
        state: present

    - name: Apply SELinux contexts
      command: restorecon -Rv {{ item }}
      loop:
        - "{{ webapp_directory }}"
        - "{{ custom_app_directory }}"
      register: restorecon_output
      changed_when: "'relabeled' in restorecon_output.stdout"

    - name: Verify contexts
      command: ls -Zd {{ webapp_directory }} {{ custom_app_directory }}/logs
      register: context_check
      changed_when: false

    - name: Display contexts
      debug:
        msg: "{{ context_check.stdout_lines }}"
