---
- name: Configure SELinux to Enforcing Mode
  hosts: selinux_servers
  become: yes

  vars:
    selinux_policy: targeted
    selinux_state: enforcing

  tasks:

    - name: Check current SELinux status
      command: sestatus
      register: selinux_status
      changed_when: false

    - name: Display current SELinux status
      debug:
        msg: "{{ selinux_status.stdout_lines }}"

    - name: Install SELinux management tools
      package:
        name:
          - policycoreutils
          - policycoreutils-python-utils
          - selinux-policy
          - selinux-policy-targeted
          - setroubleshoot-server
          - setools-console
        state: present

    - name: Set SELinux to enforcing mode
      ansible.posix.selinux:
        policy: "{{ selinux_policy }}"
        state: "{{ selinux_state }}"
      register: selinux_change

    - name: Verify SELinux mode
      command: getenforce
      register: enforce_check
      changed_when: false

    - name: Show enforcement status
      debug:
        msg: "SELinux mode: {{ enforce_check.stdout }}"
