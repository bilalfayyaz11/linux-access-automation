---
- name: Simulate Secure Credential Rotation
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - secrets.yml

  tasks:
    - name: Generate new database password
      ansible.builtin.set_fact:
        generated_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=24') }}"

    - name: Confirm password generation
      ansible.builtin.debug:
        msg: "New database password generated successfully."

    - name: Create rotated encrypted-ready secrets file
      ansible.builtin.copy:
        content: |
          ---
          db_username: {{ db_username }}
          db_password: {{ generated_password }}
          db_host: {{ db_host }}
          db_port: {{ db_port }}

          api_key: {{ api_key }}
          secret_token: {{ secret_token }}

          ssh_private_key_path: {{ ssh_private_key_path }}
          ssh_passphrase: {{ ssh_passphrase }}
        dest: /tmp/rotated-secrets.yml
        mode: '0600'
      no_log: true

    - name: Encrypt rotated secrets file
      ansible.builtin.command:
        cmd: ansible-vault encrypt /tmp/rotated-secrets.yml --vault-password-file ~/.ansible/vault/main_pass
      changed_when: true

    - name: Back up current encrypted secrets file
      ansible.builtin.copy:
        src: secrets.yml
        dest: "secrets.yml.backup.{{ ansible_date_time.epoch }}"
        mode: '0600'

    - name: Display credential rotation summary
      ansible.builtin.debug:
        msg: "Credential rotation simulation completed. New encrypted file: /tmp/rotated-secrets.yml"
