---
- name: Advanced Apache Configuration
  hosts: webservers
  become: yes

  vars:
    apache_port: 8080

  tasks:

    - name: Create custom Apache configuration
      copy:
        content: |
          Listen {{ apache_port }}

          <VirtualHost *:{{ apache_port }}>
              ServerName {{ inventory_hostname }}
              DocumentRoot /var/www/html
          </VirtualHost>
        dest: /etc/httpd/conf.d/custom.conf
        backup: yes
      notify: restart apache

    - name: Install additional packages
      dnf:
        name:
          - mod_ssl
          - httpd-tools
        state: present

  handlers:
    - name: restart apache
      systemd:
        name: httpd
        state: restarted
