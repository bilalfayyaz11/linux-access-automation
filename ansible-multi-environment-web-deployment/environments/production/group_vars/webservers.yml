---
debug_mode: false
log_level: "warn"
backup_enabled: true
monitoring_enabled: true
worker_processes: 4
worker_connections: 200
keepalive_timeout: 65
ssl_enabled: false
security_headers: true
fail2ban_enabled: true
app_version: "1.2.3"
database_pool_size: 20
cache_enabled: true
cache_ttl: 600
backup_schedule: "0 2 * * *"
backup_retention_days: 30
