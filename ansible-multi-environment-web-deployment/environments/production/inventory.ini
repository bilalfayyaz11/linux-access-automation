[webservers]
web-01 ansible_connection=local
web-02 ansible_connection=local
web-03 ansible_connection=local

[webservers:vars]
ansible_user=centos
environment=production
environment_name=Production
web_server_port=80
max_connections=200
debug_mode=false
log_level=warn
backup_enabled=true
monitoring_enabled=true
worker_processes=4
worker_connections=200
keepalive_timeout=65
ssl_enabled=false
security_headers=true
fail2ban_enabled=false
app_version=1.2.3
database_pool_size=20
cache_enabled=true
cache_ttl=600
backup_schedule=0 2 * * *
backup_retention_days=30
