---
infrastructure:
  name: "Declarative Infrastructure Automation"
  version: "1.0.0"
  description: "Reusable infrastructure automation with inventory, variables, templates, and release controls"

  components:
    webservers:
      count: 1
      type: "httpd"
      version: "2.4"

    databases:
      count: 1
      type: "mariadb"
      version: "10.x"

    loadbalancers:
      count: 1
      type: "nginx"
      version: "1.x"

  environments:
    - development
    - staging
    - production

  maintainers:
    - name: "Infrastructure Engineering"
      email: "infrastructure@example.com"

  dependencies:
    ansible_version: ">=2.14"
    python_version: ">=3.9"
