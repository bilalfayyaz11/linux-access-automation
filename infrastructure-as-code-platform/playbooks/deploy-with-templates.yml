---
- name: Deploy Infrastructure with Templates and Variables
  hosts: all
  become: yes
  gather_facts: yes

  tasks:
    - name: Install common packages
      dnf:
        name: "{{ common_packages }}"
        state: present

    - name: Create project directory
      file:
        path: "/opt/{{ project_name }}"
        state: directory
        mode: '0755'

    - name: Generate server information file
      template:
        src: server-info.txt.j2
        dest: "/opt/{{ project_name }}/server-info.txt"
        mode: '0644'

- name: Configure Web Layer
  hosts: webservers
  become: yes

  tasks:
    - name: Install web server
      dnf:
        name: "{{ web_server_package }}"
        state: present

    - name: Create application directory
      file:
        path: "/var/www/html/{{ app_name }}"
        state: directory
        owner: apache
        group: apache
        mode: '0755'

    - name: Deploy web page
      template:
        src: index.html.j2
        dest: "/var/www/html/{{ app_name }}/index.html"
        owner: apache
        group: apache
        mode: '0644'

    - name: Deploy Apache virtual host configuration
      template:
        src: apache/vhost.conf.j2
        dest: "/etc/httpd/conf.d/{{ app_name }}.conf"
        backup: yes
      notify: restart httpd

    - name: Start and enable web server
      systemd:
        name: "{{ web_server_service }}"
        state: started
        enabled: yes

  handlers:
    - name: restart httpd
      systemd:
        name: httpd
        state: restarted

- name: Configure Database Layer
  hosts: databases
  become: yes

  tasks:
    - name: Install database server
      dnf:
        name:
          - mariadb-server
          - python3-PyMySQL
        state: present

    - name: Deploy database configuration
      template:
        src: mysql/my.cnf.j2
        dest: /etc/my.cnf.d/custom.cnf
        backup: yes
      notify: restart mariadb

    - name: Start and enable database service
      systemd:
        name: mariadb
        state: started
        enabled: yes

  handlers:
    - name: restart mariadb
      systemd:
        name: mariadb
        state: restarted

- name: Configure Load Balancer Layer
  hosts: loadbalancers
  become: yes

  tasks:
    - name: Install load balancer
      dnf:
        name: "{{ lb_package }}"
        state: present

    - name: Deploy Nginx load balancer configuration
      template:
        src: nginx/load-balancer.conf.j2
        dest: "/etc/nginx/conf.d/{{ app_name }}-lb.conf"
        backup: yes
      notify: restart nginx

    - name: Start and enable load balancer
      systemd:
        name: "{{ lb_service }}"
        state: started
        enabled: yes

  handlers:
    - name: restart nginx
      systemd:
        name: nginx
        state: restarted
