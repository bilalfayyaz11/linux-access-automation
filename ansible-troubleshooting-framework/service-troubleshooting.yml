---
- name: Service Troubleshooting and Log Analysis
  hosts: all
  become: yes

  vars:
    services_to_check:
      - httpd
      - firewalld
      - sshd

    log_files:
      - /var/log/messages
      - /var/log/httpd/error_log
      - /var/log/secure

  tasks:
    - name: Check service status
      systemd:
        name: "{{ item }}"
      register: service_status
      loop: "{{ services_to_check }}"
      ignore_errors: yes

    - name: Display service status summary
      debug:
        msg: |
          Service Status Summary:
          {% for result in service_status.results %}
          - {{ result.item }}: {{ result.status.ActiveState | default('unknown') }}
          {% endfor %}

    - name: Identify failed services
      set_fact:
        failed_services: "{{ service_status.results | selectattr('status.ActiveState', 'defined') | selectattr('status.ActiveState', 'equalto', 'failed') | map(attribute='item') | list }}"

    - name: Get failed service details
      shell: "systemctl status {{ item }} --no-pager -l"
      register: failed_service_details
      loop: "{{ failed_services }}"
      when: failed_services | length > 0
      changed_when: false

    - name: Display failed service details
      debug:
        msg: |
          Failed Service: {{ item.item }}
          Status Output:
          {{ item.stdout }}
      loop: "{{ failed_service_details.results | default([]) }}"
      when: failed_services | length > 0

    - name: Check recent log entries for errors
      shell: |
        if [ -f "{{ item }}" ]; then
          tail -50 "{{ item }}" | grep -iE "error|failed|critical|panic" || echo "No recent errors found"
        else
          echo "Log file not found"
        fi
      register: log_errors
      loop: "{{ log_files }}"
      changed_when: false
      ignore_errors: yes

    - name: Display log error summary
      debug:
        msg: |
          Log File: {{ item.item }}
          Recent Findings:
          {{ item.stdout }}
      loop: "{{ log_errors.results }}"

    - name: Analyze system resource usage
      shell: |
        echo "=== CPU Usage ==="
        top -bn1 | grep "Cpu(s)" || true
        echo "=== Memory Usage ==="
        free -m
        echo "=== Load Average ==="
        uptime
      register: system_resources
      changed_when: false

    - name: Display system resource analysis
      debug:
        msg: |
          System Resource Analysis:
          {{ system_resources.stdout }}
