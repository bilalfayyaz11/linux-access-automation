---
- name: Scale Web Servers by Region
  hosts: us_east
  gather_facts: true
  become: true
  strategy: free
  serial: "50%"

  roles:
    - role: webserver

  post_tasks:
    - name: Verify regional deployment
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ http_port | default(80) }}"
        method: GET
        status_code: 200
      register: regional_health_check
      retries: 3
      delay: 5

    - name: Report regional deployment status
      ansible.builtin.debug:
        msg: "Region {{ region_name | default('local') }} deployment completed successfully"
      when: regional_health_check is succeeded
